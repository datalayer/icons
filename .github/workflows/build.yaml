name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build the package
      run: |
        set -eux
        # @datalayer/icons-all depends on the @datalayer/icons-react this
        # repository builds: for this run, from its own folder, not from npm,
        # where the version it names may not be published yet.
        npm pkg set "dependencies.@datalayer/icons-react=file:./icons-react"
        npm install --no-audit --no-fund --legacy-peer-deps
        npm run build
